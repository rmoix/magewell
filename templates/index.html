<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magewell NMS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2322c55e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span id="live-dot" class="live-dot" title="Connexió amb el servidor"></span>
      <div>
        <h1>Magewell NMS</h1>
        <div id="subtitle" class="muted small">Connectant…</div>
      </div>
    </div>

    <nav class="counters" aria-label="Resum">
      <button class="counter" data-status="ALL"><span class="lbl">Total</span><b id="c-total">0</b></button>
      <button class="counter ok" data-status="OK"><span class="lbl">OK</span><b id="c-ok">0</b></button>
      <button class="counter warn" data-status="WARNING"><span class="lbl">Avís</span><b id="c-warning">0</b></button>
      <button class="counter bad" data-status="NO_SIGNAL"><span class="lbl">Sense senyal</span><b id="c-no_signal">0</b></button>
      <button class="counter off" data-status="OFFLINE"><span class="lbl">Offline</span><b id="c-offline">0</b></button>
      <button class="counter auth" data-status="AUTH_ERROR"><span class="lbl">Auth</span><b id="c-auth_error">0</b></button>
    </nav>

    <div class="actions">
      <button id="btn-scan" class="btn primary">Escanejar xarxa</button>
      <button id="btn-poll" class="btn" title="Consulta tots els equips ara">Sondejar</button>
      <button id="btn-reload" class="btn" title="Torna a llegir config.yaml">Recarregar config</button>
      <button id="btn-alerts" class="btn">Alertes <span id="alerts-badge" class="badge">0</span></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Rol">
      <button class="seg-btn active" data-role="ALL">Tots</button>
      <button class="seg-btn" data-role="Encoder">Encoders</button>
      <button class="seg-btn" data-role="Decoder">Decoders</button>
    </div>
    <select id="f-location" aria-label="Ubicació"><option value="ALL">Totes les ubicacions</option></select>
    <input id="f-search" type="search" placeholder="Cerca nom, IP, NDI, sèrie…" aria-label="Cerca">
    <label class="check"><input id="f-problems" type="checkbox"> Només problemes</label>
    <span class="spacer"></span>
    <select id="f-sort" aria-label="Ordre">
      <option value="location">Ordre: ubicació</option>
      <option value="ip">Ordre: IP</option>
      <option value="name">Ordre: nom</option>
      <option value="status">Ordre: gravetat</option>
    </select>
    <div class="seg" role="group" aria-label="Vista">
      <button class="seg-btn active" data-view="grid" title="Graella">Graella</button>
      <button class="seg-btn" data-view="list" title="Llista">Llista</button>
    </div>
    <label class="check" title="So quan un equip passa a error"><input id="f-sound" type="checkbox"> So</label>
  </div>

  <div id="scanbar" class="scanbar hidden">
    <div class="scan-text" id="scan-text"></div>
    <div class="progress"><div id="scan-progress"></div></div>
    <button id="btn-scan-details" class="link">Detalls</button>
  </div>

  <div id="stale" class="stale hidden">Fa estona que no arriben dades del servidor. Comprova que el programa continua obert.</div>

  <main>
    <div id="devices" class="grid"></div>
    <div id="empty" class="empty hidden"></div>
  </main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawer-title">—</h2>
      <button class="btn icon" data-close="drawer" aria-label="Tancar">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
  <div id="backdrop" class="backdrop hidden"></div>

  <div id="toast" class="toast hidden"></div>

  <footer class="foot muted small">
    <span>Magewell Mini-NMS v{{ version }}</span>
    <span id="foot-cycle"></span>
  </footer>

  <script src="/static/js/app.js?v={{ version }}"></script>
</body>
</html>
